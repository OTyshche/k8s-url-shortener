apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-stats-cron
  labels:
    app: url-shortener
  namespace: url-shortener
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: redis-stats
              image: redis:7-alpine
              command:
                - redis-cli
              args: ["-h", "redis-service", "-a", "$(REDIS_PASSWORD)", "DBSIZE"]
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-pass
                      key: password
          restartPolicy: OnFailure

