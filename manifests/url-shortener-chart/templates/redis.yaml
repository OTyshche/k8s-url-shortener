apiVersion: v1
kind: Secret
metadata:
  name: redis-pass
  namespace: {{ .Release.Namespace }}
data:
  password: aGVsbG8td29ybGQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: {{ .Release.Name }}
      name: redis-pod
  template:
    metadata: 
      labels:
        name: redis-pod
        app: {{ .Release.Name }}
    spec:
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc
      containers:
      - name: redis
        image: redis:7-alpine
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 6379
        volumeMounts:
          - mountPath: "/data"
            name: redis-storage
        args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-pass
                key: password