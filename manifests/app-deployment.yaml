apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-app-deployment
  namespace: url-shortener
  labels:
    app: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      name: url-shortener-app-pod
      app: url-shortener
  template:
    metadata: 
      labels: 
        name: url-shortener-app-pod
        app: url-shortener
    spec:
      volumes:
        - name: api-config-volume
          configMap:
            name: api-config
      containers:
        - name: app-pod
          image: boodiebo/url-shortener-api:v7
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          env:
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-pass
                  key: password
          volumeMounts:
            - mountPath: "/app/config"
              name: api-config-volume
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
      imagePullSecrets:
        - name: dockerhub-secret
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-app-service
  namespace: url-shortener
  labels:
    app: url-shortener
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    name: url-shortener-app-pod
    app: url-shortener
  ports:
    - name: http
      port: 8001
      targetPort: 8000
